name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o "$(ls *.zip | head -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd KalenderTabung && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KalenderTabung-apk
          path: KalenderTabung/app/build/outputs/apk/debug/app-debug.apk
